[package]
name = "lexipulse"
version = "1.1.0"
description = "Local-first vocabulary and phrase trainer with time-pressured typing practice."
authors = ["Hangeldi Cholukov"]
license = "MIT"
repository = "https://github.com/HRuler19/Lingo-reflex"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lexipulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
# The whole point of the Tauri shell is a small binary, so trade compile time
# for size: one codegen unit lets LLVM inline and dedupe across the crate,
# panic=abort drops unwinding tables, and stripping removes symbols.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

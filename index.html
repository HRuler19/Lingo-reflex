<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- viewport-fit=cover: lets the page draw into the safe area on a
         notched/Dynamic Island device (native iOS shell) instead of being
         letterboxed by it, so the env(safe-area-inset-*) padding used in
         Header/AppSidebar actually has something to inset against. -->

    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="Local-first vocabulary and phrase trainer with time-pressured typing practice."
    />
    <title>LexiPulse</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

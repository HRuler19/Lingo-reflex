name: Release

# Publishes downloadable builds whenever a version tag is pushed:
#
#   npm version minor      # bumps package.json and creates the tag
#   git push --follow-tags
#
# Can also be run by hand from the Actions tab, which builds everything and
# uploads it as workflow artifacts without needing a tag.
#
# Covers macOS, Windows, Linux and Android. iOS is deliberately absent: Apple
# only allows installation through the App Store, TestFlight, or a build signed
# against specific device UDIDs, so there is no .ipa that a stranger could
# download from a release page and install. Building it locally still works —
# see `npm run ios:open`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure throw away the others' artifacts.
      fail-fast: false
      matrix:
        include:
          # macOS is built twice: the runner is Apple Silicon, so an Intel
          # binary needs an explicit cross-compile target.
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ''
            rust-targets: ''
          - os: ubuntu-22.04
            label: Linux
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Rust builds are slow from cold; this keeps tagged releases from
      # recompiling the whole dependency tree every time.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Tauri renders through the system webview, which on Linux is WebKitGTK
      # and is not installed on the runner by default.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Gate the release on the same checks CI runs, so a broken build can
      # never be published as a downloadable artifact.
      - run: npm run lint
      - run: npm run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag, upload into that release; otherwise just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: LexiPulse ${{ github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}

  android:
    name: Android
    runs-on: ubuntu-latest
    # Runs after the desktop matrix so the release it uploads into exists.
    needs: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Standard web build (not build:tauri): the Android shell serves the app
      # over its own local scheme and keeps the service worker.
      - run: npm run build
      - run: npx cap sync android

      # A debug-signed APK, which is directly installable by sideloading and
      # needs no signing secrets. A Play Store upload would instead need
      # `bundleRelease` plus a keystore held in repository secrets.
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST="LexiPulse-${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexipulse-Android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

name: Release

# Publishes downloadable builds whenever a version tag is pushed:
#
#   npm version minor      # bumps package.json and creates the tag
#   git push --follow-tags
#
# Can also be run by hand from the Actions tab, which builds everything and
# uploads it as workflow artifacts without needing a tag.
#
# Covers macOS, Windows, Linux and Android. iOS is deliberately absent: Apple
# only allows installation through the App Store, TestFlight, or a build signed
# against specific device UDIDs, so there is no .ipa that a stranger could
# download from a release page and install. Building it locally still works —
# see `npm run ios:open`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure throw away the others' artifacts.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the release on the same checks CI runs, so a broken build can
      # never be published as a downloadable artifact.
      - run: npm run lint
      - run: npm run test

      # The web bundle Electron wraps. Uses the electron-specific build
      # (relative asset paths, no service worker) — see vite.config.ts.
      - run: npm run build:electron

      - name: Build installers
        # electron-builder publishes to the GitHub release itself when it sees
        # a tag; GH_TOKEN is what authorises that upload.
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexipulse-${{ matrix.label }}
          # Only the distributables — not the unpacked app directories, which
          # are large and redundant once the installer exists.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    # Runs after the desktop matrix so the GitHub release electron-builder
    # creates already exists by the time this uploads into it.
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Standard web build here (not build:electron): the Android shell serves
      # the app over its own local scheme, so it wants root-absolute paths and
      # keeps the service worker.
      - run: npm run build
      - run: npx cap sync android

      # A debug-signed APK, which is directly installable by sideloading and
      # needs no signing secrets. A Play Store upload would instead need
      # `bundleRelease` plus a keystore held in repository secrets.
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST="LexiPulse-${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexipulse-Android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
